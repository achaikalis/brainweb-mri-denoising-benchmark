[project]
name = "brainweb-denoising"
version = "0.1.0"
description = "MRI Denoising Benchmark using the Brainweb Dataset"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ipykernel>=6.29", "jupyterlab>=4.3", "matplotlib>=3.9", "nibabel>=5.3",
  "numpy>=2.1", "pandas>=2.2", "scikit-image>=0.24", "scipy>=1.14", "SimpleITK>=2.4",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brainweb_denoising"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".uv-cache", "notebooks"]
